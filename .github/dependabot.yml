version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Raise this ceiling when the workbench moves to Node 26.
      - dependency-name: "@types/node"
        versions: [">=25.0.0"]
    groups:
      parse5-security:
        applies-to: security-updates
        patterns: [parse5]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
        exclude-patterns: [parse5]
      dev-patches:
        dependency-type: development
        update-types: [patch]
        exclude-patterns: [parse5]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
